name: Release

# Pushing a version tag builds the store packages and attaches them, with the
# changelog section for that version, to a GitHub release. Submitting them to
# the stores stays a manual step.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME"
      - run: npm run check
      - run: npm run zip:all
      - name: Notes from the changelog
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" \
            'index($0, "## [" v "]") == 1 {f=1; next} /^## \[/ {f=0} f' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for ${GITHUB_REF_NAME#v}"; exit 1; }
      - run: gh release create "$GITHUB_REF_NAME" .output/*.zip --title "Repohopper ${GITHUB_REF_NAME#v}" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
